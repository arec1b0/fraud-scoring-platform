name: FraudScoring CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fraud-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked dependencies
        shell: pwsh
        run: |
          uv sync --locked --dev

          if ($LASTEXITCODE -ne 0) {
            throw "Locked dependency synchronization failed"
          }

      - name: Verify Python runtime
        shell: pwsh
        run: |
          uv run --locked python -c "import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)"

          if ($LASTEXITCODE -ne 0) {
            throw "Python runtime verification failed"
          }

      - name: Compile application and tests
        shell: pwsh
        run: |
          uv run --locked python -m compileall -q src tests

          if ($LASTEXITCODE -ne 0) {
            throw "Python compilation failed"
          }

      - name: Verify FastAPI imports
        shell: pwsh
        run: |
          uv run --locked python -c "from fraud_scoring.api.app import app; assert app is not None; print('FastAPI import: OK')"

          if ($LASTEXITCODE -ne 0) {
            throw "Application import failed"
          }

      - name: Run regression suite
        shell: pwsh
        run: |
          uv run --locked pytest -q

          if ($LASTEXITCODE -ne 0) {
            throw "Python regression suite failed"
          }

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production-style Docker image
        shell: pwsh
        run: |
          docker build --tag fraud-scoring:ci .

          if ($LASTEXITCODE -ne 0) {
            throw "Docker image build failed"
          }

      - name: Start container and verify HTTP contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $baseUrl = "http://127.0.0.1:18000"

          docker run --detach `
            --name fraud-api-ci `
            --publish "127.0.0.1:18000:8000" `
            fraud-scoring:ci

          if ($LASTEXITCODE -ne 0) {
            throw "Docker container startup failed"
          }

          $ready = $false

          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $health = Invoke-RestMethod `
                -Uri "$baseUrl/health" `
                -TimeoutSec 3

              if ($health.status -eq "ok") {
                $ready = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 2
            }
          }

          if (-not $ready) {
            docker logs fraud-api-ci
            throw "API did not become healthy"
          }

          Write-Output "Health endpoint: OK"

          $metrics = Invoke-WebRequest `
            -Uri "$baseUrl/metrics" `
            -TimeoutSec 5

          if (
            $metrics.StatusCode -ne 200 -or
            -not $metrics.Content.Contains(
              "fraud_scoring_http_requests_total"
            )
          ) {
            throw "Prometheus metrics endpoint failed"
          }

          Write-Output "Prometheus metrics: OK"

          $payload = @{
            transaction_id = "ci-smoke-001"
            customer_id = "customer-ci"
            merchant_id = "merchant-ci"
            amount = "0"
            currency = "CHF"
            occurred_at = [datetimeoffset]::UtcNow.AddSeconds(
              -5
            ).ToString("o")
          }

          $invalidResponse = Invoke-WebRequest `
            -Uri "$baseUrl/score" `
            -Method Post `
            -ContentType "application/json" `
            -Body ($payload | ConvertTo-Json -Compress) `
            -SkipHttpErrorCheck `
            -TimeoutSec 5

          if ($invalidResponse.StatusCode -ne 422) {
            throw "Invalid transaction did not return HTTP 422"
          }

          Write-Output "Request validation: HTTP 422 OK"

          $payload.amount = "42.50"

          $unconfiguredResponse = Invoke-WebRequest `
            -Uri "$baseUrl/score" `
            -Method Post `
            -ContentType "application/json" `
            -Body ($payload | ConvertTo-Json -Compress) `
            -SkipHttpErrorCheck `
            -TimeoutSec 5

          if ($unconfiguredResponse.StatusCode -ne 503) {
            throw "Unconfigured scoring did not fail closed"
          }

          $errorBody = $unconfiguredResponse.Content |
            ConvertFrom-Json

          if (
            $errorBody.detail.code -ne "SCORING_UNAVAILABLE"
          ) {
            throw "Unexpected scoring failure contract"
          }

          Write-Output "Fail-closed scoring: HTTP 503 OK"
          Write-Output "Docker smoke test: PASSED"

      - name: Print container logs on failure
        if: failure()
        shell: pwsh
        run: |
          docker logs fraud-api-ci 2>&1 |
            Select-Object -Last 100

      - name: Remove smoke-test container
        if: always()
        shell: pwsh
        run: |
          $containerId = docker ps --all --quiet `
            --filter "name=^/fraud-api-ci$"

          if ($LASTEXITCODE -ne 0) {
            throw "Docker inspection failed"
          }

          if ($containerId) {
            docker rm --force fraud-api-ci

            if ($LASTEXITCODE -ne 0) {
              throw "Container cleanup failed"
            }
          }

  live-scoring:
    name: Full-stack scoring integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      GRAFANA_ADMIN_PASSWORD: ci-only-unused-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install locked dependencies
        shell: pwsh
        run: |
          uv sync --locked --dev

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency synchronization failed"
          }

      - name: Generate synthetic demonstration model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models |
            Out-Null

          uv run --locked python -m fraud_scoring.scoring.train_demo `
            --output models/demo_fraud_model.txt `
            --seed 42

          if ($LASTEXITCODE -ne 0) {
            throw "Synthetic model generation failed"
          }

      - name: Validate Docker Compose configuration
        shell: pwsh
        run: |
          docker compose config --quiet

          if ($LASTEXITCODE -ne 0) {
            throw "Docker Compose configuration is invalid"
          }

      - name: Start Redis API and Prometheus
        shell: pwsh
        run: |
          docker compose up --detach --build --wait `
            --wait-timeout 180 `
            api prometheus

          if ($LASTEXITCODE -ne 0) {
            throw "Full-stack startup failed"
          }

          docker compose ps

      - name: Verify real scoring pipeline
        shell: pwsh
        run: |
          uv run --locked python -m fraud_scoring.monitoring.stack_smoke `
            --api-url http://127.0.0.1:8000 `
            --prometheus-url http://127.0.0.1:9090 `
            --model-path models/demo_fraud_model.txt

          if ($LASTEXITCODE -ne 0) {
            throw "Live scoring integration failed"
          }

      - name: Print integration logs on failure
        if: failure()
        shell: pwsh
        run: |
          docker compose logs --tail 100 redis api prometheus

      - name: Stop integration containers
        if: always()
        shell: pwsh
        run: |
          docker compose down --remove-orphans

          if ($LASTEXITCODE -ne 0) {
            throw "Integration container cleanup failed"
          }
