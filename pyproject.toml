[project]
name = "fraud-scoring-platform"
version = "0.1.0"
description = "Real-time fraud risk scoring platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "lightgbm>=4.6,<5",
    "numpy>=2,<3",
    "redis>=6.2,<7",
    "pyarrow>=18,<30",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<10",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_scoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
